<html>
	<head>
	<!-- Bootstrap CSS -->
		<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous">
		<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
		<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
		<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV" crossorigin="anonymous"></script>
		<title>Alzheimer Test</title>
	</head>
	<body style="border: blueviolet;"
	style="background-color: aqua;"> 
	<!-- Java Script -->	
		<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
		<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
		<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV" crossorigin="anonymous"></script>

		
		<!-- Navbar-->
		<nav class="navbar sticky-top navbar-dark bg-dark">
			<div class="container-fluid">
			  <a class="navbar-brand" href="{{url_for('home')}}">MedCheck</a>
			</div>
		  </nav>
		<div class="container">
			<br>
			<!--Form-->
			<form action = "{{url_for('predict',checkup='alzheimer')}}" method ="POST" >
				<fieldset>
				<legend >Alzheimer Prediction Using Machine Learning</legend><br>
				  <div class="card card-body">
					  <div class="form-group  col-sm">
						<div class="col-sm">
							<label for="age">Age</label>
							<input type="number" class="form-control" id="age" name="age" required>
						</div>
						<div class="col-sm">
							<label for="sex" >Gender</label>
							<select class="form-control" id="sex"  name="sex" required>
							  <option disabled selected value> -- Select an Option -- </option>
							  <option value = "1" style="color: blue;" style="background-color: aqua;">Male</option>
							  <option value = "0" style="color: purple;" style="background-color: palevioletred;">Female</option>
							</select>
					   </div>
					  </div>
					  <br>
					  <div class="form-group  col-sm">
						  <div class="col-sm">
							<label for="EDUC">Years of Education</label>
							<input type="number" class="form-control" id="EDUC" name = "EDUC" required>
						  </div>
						  <div class="col-sm">
							<label for="SES">Socioeconomic Status</label>
							<input type="number" class="form-control" id="SES" name="SES"  required>
						  </div>
						  <div class="col-sm">
							<label for="MMSE">Mini Mental State Examination</label>
							<input type="number" class="form-control" id="MMSE" name="MMSE" required>
						  </div>
						  <div class="col-sm">
							<label for="eTIV">Estimated Total Intracrancial Volume</label>
							<input type="number" class="form-control "id="eTIV" name="eTIV" required>
						  </div>
						  <div class="col-sm">
						    <label for="nWBV">Normalize Whole Brain Volume</label>
							<input type="number" class="form-control "id="nWBV" name="nWBV" required>
						  </div>
						  
							<div class="col-sm">
							<label for="ASF">Atlas Scaling Factor</label>
							<input type="number" class="form-control "id="ASF" name="ASF" required>
						</div>
					  </div>
					   <br>
					  <div class="form-group">
						<input class="btn btn-primary" type="submit" value="Result" style="border: aqua;" style="background-color: crimson;">
					  </div>
					  
					  <!--Prediction Result-->
					  <div id ="result">
							<strong style="color:red">{{result}}</strong>
					 </div>
				     </div>
			 </fieldset>
			</form>
			
		</div>
		
	</body>
</html>
