<html>
	<head>
	<!-- Bootstrap CSS -->
		<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous">
		<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
		<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
		<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV" crossorigin="anonymous"></script>
		<title>Breast Cancer Test</title>
	</head>
	<body style="border: blueviolet;"
	style="background-color: aqua;"> 
	<!-- Java Script -->	
		<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
		<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
		<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV" crossorigin="anonymous"></script>

		
		<!-- Navbar-->
		<nav class="navbar sticky-top navbar-dark bg-dark">
			<div class="container-fluid">
			  <a class="navbar-brand" href="{{url_for('home')}}">MedCheck</a>
			</div>
		  </nav>
		<div class="container">
			<br>
			<!--Form-->
			<form action = "{{url_for('predict',checkup='breast_cancer')}}" method ="POST" >
				<fieldset>
				<legend >Breast Cancer Prediction Using Machine Learning</legend><br>
				  <div class="card card-body">
					  <div class="form-group  col-sm">	
					  </div>
					  <br>
					  <div class="form-group  col-sm">
						  <div class="col-sm">
							<label for="radiusMean">Radius Mean</label>
							<input type= "number"class="form-control" id="radiusMean" name = "radiusMean" required>
							
						  </div>
						  <div class="col-sm">
							<label for="textureMean">Texture Mean</label>
							<input type="number" class="form-control" id="textureMean" name="textureMean"  required>
						  </div>
						  <div class="col-sm">
							<label for="perimeterMean">Perimeter Mean</label>
							<input type="number" class="form-control" id="perimeterMean" name="perimeterMean" required>
						  </div>
						  <div class="col-sm">
							<label for="areaMean">Area Mean</label>
							<input type="number" class="form-control" id="areaMean" name="areaMean" required>
						</div>
					  </div>
					  <div class="form-group col-sm">
							<div class="col-sm">
								<label for="smoothnessMean">Smoothness Mean </label>
								<input type="number" class="form-control" id="smoothnessMean" name="smoothnessMean" required>
							  </div>
							  <div class="col-sm">
								<label for="compactnessMean">Compactness Mean </label>
								<input type="number" class="form-control" id="compactnessMean" name="compactnessMean" required>
							  </div>
							  <div class="col-sm">
								<label for="concavityMean">Concavity Mean</label>
								<input type="number" step="any" class="form-control" id="concavityMean" name="concavityMean" required>
							  </div>
							  <div class="col-sm">
								<label for="concavePointsMean">Concave Points Mean</label>
								<input type="number" class="form-control" id="concavePointsMean" name="concavePointsMean" required>
								</div>
							  <div class="col-sm">
								 <label for="symmetryMean">Symmetry Mean</label>
								 <input type="number" class="form-control" id="symmetryMean" name="symmetryMean" required>
								 </div>
							  <div class="col-sm">
									<label for="fractalDimensionMean">Fractal Dimension Mean</label> Mean</label>
									<input type="number" class="form-control" id="fractalDimensionMean" name="fractalDimensionMean" required>
									</div>
						  </div>
						  <div class="form-group  col-sm">
							<div class="col-sm">
							  <label for="radius">Radius </label>
							  <input type= "number"class="form-control" id="radius" name = "radius" required>
							  
							</div>
							<div class="col-sm">
							  <label for="texture">Texture </label>
							  <input type="number" class="form-control" id="texture" name="texture"  required>
							</div>
							<div class="col-sm">
							  <label for="perimeter">Perimeter</label>
							  <input type="number" class="form-control" id="perimeter" name="perimeter" required>
							</div>
							<div class="col-sm">
							  <label for="area">Area</label>
							  <input type="number" class="form-control" id="area" name="area" required>
						  </div>
						</div>
						<div class="form-group col-sm">
							  <div class="col-sm">
								  <label for="smoothness">Smoothness</label>
								  <input type="number" class="form-control" id="smoothness" name="smoothness" required>
								</div>
								<div class="col-sm">
								  <label for="compactness">Compactness</label>
								  <input type="number" class="form-control" id="compactness" name="compactness" required>
								</div>
								<div class="col-sm">
								  <label for="concavity">Concavity</label>
								  <input type="number" step="any" class="form-control" id="concavity" name="concavity" required>
								</div>
								<div class="col-sm">
								  <label for="concavePoints">Concave Point</label>
								  <input type="number" class="form-control" id="concavePoints" name="concavePoints" required>
								  </div>
							</div>
						  <div class="form-group  col-sm">
						  <div class="col-sm">
							<label for="symmetry">Symmetry</label>
							<input type="number" class="form-control" id="symmetry" name="symmetry" required>
						  </div>
						  <div class="col-sm">
							<label for="fractalDimensionMean">Fractal Dimension</label>
							<input  type="number" class="form-control" id="fractalDimensionMean" name = "fractalDimensionMean" required>
						  </div>
						  <div class="col-sm">
							<label for="radiusWorst">Radius Worst</label>
							<input  type="number" class="form-control" id="radiusWorst" name = "radiusWorst" required>
						  </div>
						  <div class="col-sm">
							  <label for="textureWorst">Texture Worst</label>
							  <input  type="number" class="form-control" id="textureWorst" name = "textureWorst" required>
						  </div>
						  <div class="col-sm">
							<label for="perimeterWorst">Perimeter Worst</label>
							<input  type="number" class="form-control" id="perimeterWorst" name = "perimeterWorst" required>
						  </div>
						  <div class="col-sm">
							<label for="areaWorst">Area Worst</label>
							<input  type="number" class="form-control" id="areaWorst" name = "areaWorst" required>
						  </div>
						  <div class="col-sm">
							<label for="smoothnessWorst">Smoothness Worst</label>
							<input  type="number" class="form-control" id="smoothnessWorst" name = "smoothnessWorst" required>
						  </div>
						  <div class="col-sm">
							<label for="compactnessWorst">Compactness Worst</label>
							<input type="number" class="form-control" id="compactnessWorst" name = "compactnessWorst" required>
					  </div>
					  <div class="col-sm">
						<label for="concavityWorst">Concavity Worst</label>
						<input type="number" class="form-control" id="concavityWorst" name = "concavityWorst" required>
						</div>
					<div class="col-sm">
						<label for="concavePointsWorst">Concave Points Worst</label>
						<input type="number" class="form-control" id="concavePointsWorst" name = "concavePointsWorst" required>		
				  </div>
				  <div class="col-sm">
					<label for="symmetryWorst">Symmetry Worst</label>
					<input type="number" class="form-control" id="symmetryWorst" name = "symmetryWorst" required>		
			  </div>
			  <div class="col-sm">
				<label for="fractcalDimensionWorst">Fractal Dimension Worst</label>
				<input type="number" class="form-control" id="fractcalDimensionWorst" name = "fractcalDimensionWorst" required>		
		     </div>
				  
					  <br>
					  <div class="form-group">
						<input class="btn btn-primary" type="submit" value="Result" style="border: aqua;" style="background-color: crimson;">
					  </div>
					  
					  <!--Prediction Result-->
					  <div id ="result">
							<strong style="color:red">{{result}}</strong>
					 </div>
				     </div>
			 </fieldset>
			</form>
			
		</div>
		
	</body>
</html>
