<html>
	<head>
	<!-- Bootstrap CSS -->
		<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous">
		<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
		<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
		<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV" crossorigin="anonymous"></script>
		<title>Diabetes Test</title>
	</head>
	<body style="border: blueviolet;"
	style="background-color: aqua;"> 
	<!-- Java Script -->	
		<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
		<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
		<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV" crossorigin="anonymous"></script>

		
		<!-- Navbar-->
		<nav class="navbar sticky-top navbar-dark bg-dark">
			<div class="container-fluid">
			  <a class="navbar-brand" href="{{url_for('home')}}">MedCheck</a>
			</div>
		  </nav>
		<div class="container">
			<br>
			<!--Form-->
			<form action = "{{url_for('predict',checkup='diabetes')}}" method ="POST" >
				<fieldset>
				<legend >Diabetes Prediction Using Machine Learning</legend><br>
				  <div class="card card-body">
					  <div class="form-group  col-sm">
						<div class="col-sm">
							<label for="pregnancies">Pregrancies</label>
							<input type="number" class="form-control" id="pregnancies" name="pregnancies" required>
						</div>
						<div class="form-group  col-sm">
							<div class="col-sm">
								<label for="glucose">Glucose</label>
								<input type="number" class="form-control" id="glucose" name="glucose" required>
							</div>
					  </div>
						
						  <div class="col-sm">
							  <label for="Age">Age</label>
							  <input type="number" class="form-control" id="Age" name="Age" required>
						  </div>
						  <div class="col-sm">
							<label for="trestbps">Resting Blood Pressure in mm Hg</label>
							<input type="number" class="form-control" id="trestbps" name="trestbps"  required>
						  </div>
						  <div class="col-sm">
							<label for="skinThickness">Skin Thickness</label>
							<input type="number" class="form-control" id="skinThickness" name="skinThickness" required>
						  </div>
						  <div class="col-sm">
							<label for="insulin">Insulin</label>
							<input type="number" class="form-control" id="insulin" name="insulin"  required>
						</div>
						<div class="col-sm">
							<label for="BMI">BMI</label>
							<input type="number" class="form-control" id="BMI" name="BMI" required>
						</div>
						<div class="col-sm">
							<label for="diabetesPedigreeFunction">diabetes Pedigree Function</label>
							<input type="number" class="form-control" id="diabetesPedigreeFunction" name="diabetesPedigreeFunction" required>
						</div>
					  </div>
					  
					  <br>
					  <div class="form-group">
						<input class="btn btn-primary" type="submit" value="Result" style="border: aqua;" style="background-color: crimson;">
					  </div>
					  
					  <!--Prediction Result-->
					  <br>
					  <div id ="result">
							<strong style="color:red">{{result}}</strong>
					 </div>
				     </div>
			 </fieldset>
			</form>
			
		</div>
		
	</body>
</html>
